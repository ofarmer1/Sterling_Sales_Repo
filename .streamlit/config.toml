[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#F6F7FA"
secondaryBackgroundColor = "#EEF1F6"
textColor = "#1A1A1A"
font = "sans serif"

[client]
# Hide Streamlit's developer menu ("Deploy" button etc.) from users.
toolbarMode = "viewer"

[browser]
# Don't send anonymous usage statistics to Streamlit.
gatherUsageStats = false
